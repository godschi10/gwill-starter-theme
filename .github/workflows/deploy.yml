name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.SSH_HOST }} -p 22 >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /var/www &&
            sudo git -c core.sshCommand='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' -C wp-content/themes/gwill-starter-theme pull origin main &&
            sudo git -c core.sshCommand='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' -C wp-content/plugins/vibe-comments pull origin main &&
            sudo chown -R www-data:www-data wp-content/themes/gwill-starter-theme wp-content/plugins/vibe-comments &&
            sudo wp cache flush --allow-root --path=/var/www &&
            echo 'Deploy complete'
          "